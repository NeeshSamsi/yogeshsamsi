name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # must match the Vercel project's Node version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # `pnpm lint` runs `next lint`, which is removed in Next 16 - update this
      # step (and the eslint flat config, todo 176) in the same commit that
      # upgrades to Next 16, or this step will break.
      - run: pnpm lint
      - run: pnpm build
        env:
          # Sentry source-map upload needs this on prod builds; without it the
          # build still succeeds but warns. Add as a repo secret if the noise matters.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
